name: develop 변경 알림

on:
  push:
    branches: [develop]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: 디스코드로 알림 보내기
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RAW_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          AUTHOR: ${{ github.event.head_commit.author.name }}
        run: |
          TITLE=$(printf '%s' "$RAW_MESSAGE" | head -1)
          CONTENT=$(printf '**develop 에 변동 사항이 생겼습니다.**\n\n> %s\n작업자: %s\n%s\n\n작업 시작 전에 아래 두 줄 먼저 실행해 주세요.\n```\ngit checkout develop\ngit pull origin develop\n```\n그 다음에 브랜치 파서 작업해 주세요~' "$TITLE" "$AUTHOR" "$COMMIT_URL")
          jq -n --arg c "$CONTENT" '{content: $c}' > payload.json
          curl -sS -f -H "Content-Type: application/json" -d @payload.json "$WEBHOOK"
